# ============================================================================
# BoopaDB QA Review — PRODUCTION (step 4, 2026-11-17).
#
# Production form of the trial workflow (trial run 44078928087
# recorded the QA verdict that trial promote 44082030724 consumed),
# converted per §2 of step4_preflight_report_20261117.md. The trial
# file (blob b47487d858b7173c670fbfb46fac976eb7f0abeb, itself an
# adaptation of the v7 draft) is retained in git history on the
# trial branch; this file's per-delta change log is in PRODUCTION.md
# of the production package. Placement target: MametaroGG/boopadb,
# branch main, path .github/workflows/boopadb-qa-review.yml.
#
# WHAT THIS WORKFLOW DOES: records one independent QA verdict for
# one explicitly named candidate as a checkable artifact
# (boopadb-qa-review-<run_id> / qa-review-record.json), which
# boopadb-promote.yml then asserts field by field before deploying.
# * INPUT MODEL: the reviewed input is the tracker Daily
#   `boopadb_handoff` candidate artifact, which this repo's token
#   cannot download cross-repository. This workflow fetches the SAME
#   production transport as promote (T1: the bare candidate ZIP on
#   Drive, anyone-with-link) and recomputes the candidate ZIP's
#   digest from the downloaded bytes — the v7 principle is
#   preserved: the digest in the record is computed here, from the
#   artifact, never typed in. The expected_digest input is a
#   cross-check only. All candidate inputs are required with NO
#   defaults: a production review must name its candidate
#   explicitly.
# * SOURCE RUN VERIFICATION: the source run lives in the TRACKER
#   repo and cannot be read with this repo's GITHUB_TOKEN. The
#   record instead binds: the tracker run id + artifact id
#   (dispatcher-supplied traceability identifiers), the recomputed
#   artifact digest, and the candidate-internal bindings read from
#   the artifact itself (candidate_snapshot_sha256,
#   price_source_commit from verification.json). Promote asserts all
#   of them. The substantive binding is the digest, as in v7.
#   (API-level source-run verification returns only with the step-5
#   GitHub App transport, pre-flight decision D2.)
# * WORKFLOW BLOB PIN: only this workflow's blob is verifiable
#   in-repo, so the record binds qa_workflow_blob (this file at this
#   run's head SHA, checked against generator/workflow_pins.json);
#   there is no source_workflow_blob.
# * Kept unchanged: the qa-approval environment declaration (its
#   required-reviewer protection is an OWNER settings step,
#   configured at step-4 execution per pre-flight report §4 — this
#   file only declares the environment); verdict recorded verbatim,
#   "fail" recorded and uploaded exactly like "pass" (recording is
#   not approval — promote rejects any verdict != pass);
#   qa_report_ref binds the independent QA report identifier (e.g.
#   Muse's Gate C verification report) for traceability; read-only
#   permissions; no PAT, no secrets beyond the default GITHUB_TOKEN;
#   the record is an artifact of THIS run.
# * Action references use immutable commit SHAs (trial-branch
#   convention) instead of the v7 draft's version tags.
#
# WHO DISPATCHES THIS, AND WHEN: only after an independent QA
# verdict for the candidate digest exists (Muse's Gate C
# verification). The dispatcher sets qa_report_ref to that report's
# identifier.
# ============================================================================

name: BoopaDB QA Review

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Tracker Daily run ID that produced the candidate artifact under review (traceability; the binding is the recomputed digest). No default: a production review must name its candidate explicitly."
        required: true
        type: string
      candidate_artifact_id:
        description: "Tracker artifact ID of the candidate ZIP under review. No default."
        required: true
        type: string
      expected_digest:
        description: "SHA256 (64-hex) of the candidate ZIP. This workflow recomputes it from the downloaded artifact and fails on mismatch — the value is a cross-check, never trusted. No default."
        required: true
        type: string
      candidate_file_id:
        description: "Google Drive file ID of the bare candidate ZIP (production transport T1; integrity rests on the recomputed digest, not on Drive). No default."
        required: true
        type: string
      verdict:
        description: "The independent QA verdict for THIS candidate digest. Recorded verbatim; promote accepts only 'pass'."
        required: true
        type: choice
        options:
          - pass
          - fail
      qa_report_ref:
        description: "Identifier of the independent QA report behind this verdict (e.g. the Gate C verification report file name). Bound into the record for traceability."
        required: true
        type: string

permissions:
  contents: read
  actions: read # contents API read of this workflow's blob at this run's head SHA

env:
  PYTHON_VERSION: "3.12"
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
  EXPECTED_DIGEST: ${{ inputs.expected_digest }}
  CANDIDATE_FILE_ID: ${{ inputs.candidate_file_id }}
  VERDICT: ${{ inputs.verdict }}
  QA_REPORT_REF: ${{ inputs.qa_report_ref }}
  # No compiled candidate pins in production: every candidate value
  # arrives as a dispatch input, and the digest is recomputed from
  # the downloaded bytes (see the recompute step).

jobs:
  qa-review:
    name: Record independent QA verdict (bound to the candidate digest)
    runs-on: ubuntu-latest
    # The qa-approval environment is the authority anchor. Its
    # required-reviewer approval (an owner settings step — NOT
    # configured by this file) is the explicit confirmation by an
    # authorized person; GitHub records who approved. The record
    # below binds the environment name so a record produced outside
    # this job shape is distinguishable.
    environment: qa-approval
    steps:
      - name: Checkout BoopaDB repo (workflow pins)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable (trial-branch convention)
        with:
          persist-credentials: false

      - name: Set up Python (stdlib only, no pip installs)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, immutable
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate input formats FIRST (fail closed)
        run: |
          set -euo pipefail
          mkdir -p review-work
          if ! printf '%s' "$CANDIDATE_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::candidate_run_id must be numeric"
            exit 1
          fi
          if ! printf '%s' "$CANDIDATE_ARTIFACT_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::candidate_artifact_id must be numeric"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::expected_digest must be a 64-hex SHA256"
            exit 1
          fi
          if ! printf '%s' "$CANDIDATE_FILE_ID" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::candidate_file_id has unexpected characters"
            exit 1
          fi
          if [ -z "$QA_REPORT_REF" ]; then
            echo "::error::qa_report_ref (independent QA report identifier) is required"
            exit 1
          fi

      - name: Download candidate transport (Drive carrier ZIP)
        run: |
          set -euo pipefail
          # Same production transport as promote (T1): the bare
          # candidate ZIP on Drive. The transport is NOT trusted —
          # the next step recomputes the digest from these exact
          # bytes and fails on any mismatch, so an interstitial/HTML
          # response stops the run (fail closed).
          curl -fL --retry 2 \
            "https://drive.usercontent.google.com/download?id=${CANDIDATE_FILE_ID}&export=download&confirm=t" \
            -o review-work/candidate.zip
          actual_bytes="$(stat -c%s review-work/candidate.zip)"
          echo "candidate transport downloaded: $actual_bytes bytes (digest recomputed in the next step)"

      - name: Recompute the candidate digest from the artifact bytes (never trust the input)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, sys, zipfile
          from pathlib import Path

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          blob = Path("review-work/candidate.zip").read_bytes()
          actual = sha256(blob)
          if actual != os.environ["EXPECTED_DIGEST"]:
              fail(f"candidate ZIP digest mismatch: got {actual}, "
                   f"expected {os.environ['EXPECTED_DIGEST']}")
          czf = zipfile.ZipFile(io.BytesIO(blob))
          if czf.testzip() is not None:
              fail("candidate ZIP CRC check failed")
          # Candidate-internal bindings recorded in the record:
          # the snapshot hash and the price source commit, read
          # from the artifact's own verification record.
          ver = json.loads(czf.read("verification.json"))
          if ver.get("schema") != "boopa-retained-candidate-verification-r1":
              fail(f"verification schema mismatch: {ver.get('schema')!r}")
          if ver.get("publication_performed") is not False:
              fail("verification claims publication was performed — refused")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"CANDIDATE_SNAPSHOT_SHA256="
                       f"{ver['candidate_snapshot_sha256']}\n")
              fh.write(f"PRICE_SOURCE_COMMIT={ver['price_source_commit']}\n")
          print(f"digest OK (recomputed): {actual}; "
                f"snapshot {ver['candidate_snapshot_sha256'][:16]}…, "
                f"price_source_commit {ver['price_source_commit']}")
          PY

      - name: Verify this workflow's blob against workflow_pins.json (trusted version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A workflow PATH match is not a version guarantee: fetch
          # this file's git blob SHA at this run's head commit
          # through the contents API and require equality with the
          # trusted version pinned in generator/workflow_pins.json.
          # The verified blob SHA is bound into the record, and
          # promote re-verifies it independently.
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/boopadb-qa-review.yml?ref=${GITHUB_SHA}" > review-work/qa-file.json
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          pins = json.loads(Path("generator/workflow_pins.json").read_text())
          qa_blob = json.loads(
              Path("review-work/qa-file.json").read_text()).get("sha")
          if qa_blob != pins["workflows"]["boopadb-qa-review.yml"]:
              fail(f"this run's qa-review workflow blob {qa_blob} != "
                   f"pinned {pins['workflows']['boopadb-qa-review.yml']}")
          Path("review-work/qa-workflow-blob.txt").write_text(qa_blob)
          print(f"workflow blob OK: qa-review={qa_blob}")
          PY

      - name: Write the QA review record
        run: |
          set -euo pipefail
          mkdir -p review-out
          python3 - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          record = {
              "schema": 1,
              "source_run_id": os.environ["CANDIDATE_RUN_ID"],
              "source_repo": "MametaroGG/booth-vrc-price-tracker",
              "candidate_artifact_id": os.environ["CANDIDATE_ARTIFACT_ID"],
              "artifact_digest": os.environ["EXPECTED_DIGEST"],
              "candidate_snapshot_sha256":
                  os.environ["CANDIDATE_SNAPSHOT_SHA256"],
              "price_source_commit": os.environ["PRICE_SOURCE_COMMIT"],
              "verdict": os.environ["VERDICT"],
              "qa_run_id": os.environ["GITHUB_RUN_ID"],
              "qa_report_ref": os.environ["QA_REPORT_REF"],
              "reviewer": os.environ["GITHUB_ACTOR"],
              "reviewed_at": dt.datetime.now(dt.timezone.utc).isoformat(),
              # The attestation context — the qa-approval environment
              # this job ran under (its required-reviewer approval is
              # the authorized person's confirmation), and the pinned
              # workflow blob verified above.
              "environment": "qa-approval",
              "qa_workflow_blob": Path(
                  "review-work/qa-workflow-blob.txt").read_text().strip(),
          }
          Path("review-out/qa-review-record.json").write_text(
              json.dumps(record, indent=1, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## BoopaDB QA review record\n\n")
              for k, v in record.items():
                  fh.write(f"- {k}: {v}\n")
          print(record)
          PY

      - name: Upload the QA review record artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable (trial-branch convention)
        with:
          name: boopadb-qa-review-${{ github.run_id }}
          path: review-out
          retention-days: 7
          overwrite: false
        # Layout: the artifact root contains qa-review-record.json.
        # Promote downloads it with path: review and reads
        # review/qa-review-record.json.
