# ============================================================================
# BoopaDB Promote — PRODUCTION (step 4, 2026-11-17).
#
# Production form of the trial workflow that ran end-to-end as trial
# promote run 44082030724 (Gate A re-run PASS in Actions, candidate
# contract + projection gates PASS, QA record bound to qa-review run
# 44078928087), converted per §2 of
# step4_preflight_report_20261117.md. The trial file (blob
# 21f9f4cca5fcb45abfca5ee9d078eed0ecd32eba, itself an adaptation of
# the v7 draft) is retained in git history on the trial branch; this
# file's per-delta change log is in PRODUCTION.md of the production
# package. Placement target: MametaroGG/boopadb, branch main, path
# .github/workflows/boopadb-promote.yml.
#
# WHAT THIS WORKFLOW DOES: verifies one bound candidate end-to-end
# and deploys it to GitHub Pages. The publication input is the
# tracker Daily `boopadb_handoff` candidate artifact (owner plan
# 2026-11-17, decision 3). The candidate's own contract is
# EXPORT.json + verification.json + candidate/snapshot-manifest.json;
# the promote gate binds to (plan decision 4) the artifact digest,
# the EXPORT.json byte inventory, and the snapshot-manifest hash
# chain — the candidate carries no receipt documents and none are
# required.
# * TRANSPORT (T1, pre-flight decision D1): actions/download-artifact
#   with this repo's GITHUB_TOKEN cannot download an artifact of the
#   tracker repo (cross-repository artifact access is not granted).
#   The carrier is the bare candidate ZIP on Google Drive
#   (anyone-with-link), supplied per dispatch by file ID. The
#   transport is NEVER trusted: the downloaded bytes' SHA-256 is
#   asserted against the expected_digest dispatch input before any
#   use, and the digest is recomputed independently by
#   boopadb-qa-review.yml. Integrity rests on the digest, not on
#   Drive.
# * GATES, in order: fail-closed input validation; QA review run
#   identity (API) + QA record field assertions, including
#   record.environment == "qa-approval" (an enforced approval once
#   the environment's protection rules are configured — owner
#   settings step, pre-flight report §4) and the qa-review workflow
#   blob pin in generator/workflow_pins.json; transport digest;
#   candidate contract (EXPORT inventory + verification.json +
#   manifest chain, snapshot hash computed from the bytes);
#   lineage/freshness against the live site (expected parent digest
#   input, max_date monotonicity, ±10% visible-count band);
#   Gate A (verify_runtime_final_r2.cjs, 76 checks) re-run on the
#   extracted bytes, suite fetched from the tracker checkout and
#   hash-pinned against DEPLOYMENT-CODE-INVENTORY.json (itself
#   hash-pinned); projection gate (check_projection.py --gate,
#   evaluation time = this run's current UTC).
# * DEPLOY: live. The verified site tree is published with
#   upload-pages-artifact + deploy-pages under the github-pages
#   environment. Nothing in this file deploys unverified bytes:
#   every gate above must pass first, and any failure leaves the
#   previously deployed site serving.
# * Discipline kept from v7/trial: single promote job, top-level
#   read-only permissions with pages:write / id-token:write confined
#   to the promote job, fail-closed input validation FIRST, inputs
#   passed via env (never expanded inside run: blocks), promotion
#   record + step summary, failure-evidence artifacts, concurrency
#   group "pages" (never cancel an in-flight deployment).
# * Action references use immutable commit SHAs (trial-branch
#   convention), except upload-pages-artifact / deploy-pages, for
#   which no reviewed immutable SHA exists in the source materials —
#   they keep their version tags (accepted in the trial, pre-flight
#   report §2 delta 9).
# ============================================================================

name: BoopaDB Promote

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Tracker Daily run ID that produced the candidate artifact (traceability binding; the substantive binding is the digest)."
        required: true
        type: string
        default: "43971064241"
      candidate_artifact_id:
        description: "Tracker artifact ID of the candidate ZIP."
        required: true
        type: string
        default: "14301452000"
      expected_digest:
        description: "SHA256 (64-hex) of the candidate ZIP itself (the bare candidate ZIP carried on Drive). Recomputed from the downloaded bytes and from the artifact's own inventory; fails closed on any mismatch."
        required: true
        type: string
        default: "7f6bcba3342cbc34c79dff55b40e34a9aec48916f7183fa7d717f23a221f0afa"
      candidate_file_id:
        description: "Google Drive file ID of the bare candidate ZIP (production transport T1; integrity rests on the digest, not on Drive). NOTE: the retained default is the trial handover wrapper's ID, which is NOT a valid production carrier — every production dispatch must supply this input explicitly; relying on the default fails closed at the digest assertion."
        required: true
        type: string
        default: "1UszBRj3xm-Kz4hDQTmybc-Ei5rUh5Ros"
      qa_run_id:
        description: "Run ID of the BoopaDB QA Review workflow run that recorded the independent QA verdict for THIS candidate digest (its artifact boopadb-qa-review-<id> holds qa-review-record.json). Verified via the GitHub API; the record's digest, snapshot and verdict are asserted, not just recorded."
        required: true
        type: string
      tracker_commit:
        description: "Tracker commit the candidate was generated from (its price_source_commit) and the ref checked out for the Gate A suite + projection raw histories. The checked-out code is hash-pinned, so a divergent tree fails closed."
        required: true
        type: string
        default: "f2b015e1d5e9dcdbc2fd4256c6b8b2769df89668"
      expected_visible:
        description: "Expected visible item count of THIS candidate, from Muse's Gate C verification report for the specific candidate. No default: a production dispatch must name its candidate's values explicitly."
        required: true
        type: string
      expected_public_files:
        description: "Expected EXPORT.json public_files count of THIS candidate, from the Gate C verification report. No default."
        required: true
        type: string
      expected_max_date:
        description: "Expected snapshot max_date (YYYY-MM-DD) of THIS candidate, from the Gate C verification report. No default."
        required: true
        type: string
      expected_live_snapshot_sha256:
        description: "SHA256 (64-hex) of the LIVE site's snapshot-manifest.json — the expected parent this deploy must sit on (deploy #1: the baseline pin in generator/baseline_pin.json; later deploys: the previous promotion record's deployed snapshot digest). The lineage gate fetches the live manifest and fails closed on any mismatch. No default."
        required: true
        type: string

# Top level stays read-only; write scopes are granted only inside the
# promote job below (unchanged from v7).
permissions:
  contents: read

# One Pages deployment at a time; never cancel an in-flight deployment.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"  # stdlib only
  NODE_VERSION: "24.22.1" # exact reviewed runtime (Gate A suite), as in the trial OFF daily
  # Passed via env, never expanded inside run: blocks (v7 rule).
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
  EXPECTED_DIGEST: ${{ inputs.expected_digest }}
  CANDIDATE_FILE_ID: ${{ inputs.candidate_file_id }}
  QA_RUN_ID: ${{ inputs.qa_run_id }}
  TRACKER_COMMIT: ${{ inputs.tracker_commit }}
  EXPECTED_VISIBLE: ${{ inputs.expected_visible }}
  EXPECTED_PUBLIC_FILES: ${{ inputs.expected_public_files }}
  EXPECTED_MAX_DATE: ${{ inputs.expected_max_date }}
  EXPECTED_LIVE_SNAPSHOT_SHA256: ${{ inputs.expected_live_snapshot_sha256 }}
  TRACKER_REPO: "MametaroGG/booth-vrc-price-tracker"
  QA_REVIEW_ARTIFACT_NAME_PREFIX: "boopadb-qa-review-"
  # --- Compiled pins. Production carries NO candidate pin block:
  # the candidate's expected values arrive as dispatch inputs (from
  # the Gate C report for the specific candidate), and the candidate
  # snapshot hash is computed from the extracted bytes in the
  # contract step (CANDIDATE_SNAPSHOT_ACTUAL). What stays compiled
  # is only the Gate A suite identity: the suite file and its code
  # inventory, pinned by SHA256 (the inventory hash is the same pin
  # the tracker Daily workflow itself verifies).
  CODE_INVENTORY_SHA256: "a0f9f6e9cccdef5aa976b68ce89e21403516b56916384bd5091257f8eee40600"
  SUITE_SHA256: "2131828c8b60a4a7ddebf164906040395210a690b2d1df0c60c9e5ab18483ce8"

jobs:
  # ------------------------------------------------------------------------
  # Single job: promote — verify the bound candidate and its QA
  # record end-to-end, then deploy the verified bytes to Pages.
  # ------------------------------------------------------------------------
  promote:
    name: Verify candidate + QA record and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read   # download artifacts + read run records via the API
      pages: write    # upload-pages-artifact + deploy-pages
      id-token: write # deploy-pages OIDC
    steps:
      - name: Validate input formats FIRST (fail closed)
        run: |
          set -euo pipefail
          mkdir -p promote-work
          if ! printf '%s' "$CANDIDATE_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::candidate_run_id must be numeric"
            exit 1
          fi
          if ! printf '%s' "$CANDIDATE_ARTIFACT_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::candidate_artifact_id must be numeric"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::expected_digest must be a 64-hex SHA256"
            exit 1
          fi
          if ! printf '%s' "$QA_RUN_ID" | grep -Eq '^[0-9]+$'; then
            echo "::error::qa_run_id must be the numeric Actions run ID"
            exit 1
          fi
          if ! printf '%s' "$TRACKER_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tracker_commit must be a 40-hex commit SHA"
            exit 1
          fi
          if ! printf '%s' "$CANDIDATE_FILE_ID" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::candidate_file_id has unexpected characters"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_VISIBLE" | grep -Eq '^[0-9]+$'; then
            echo "::error::expected_visible must be numeric"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_PUBLIC_FILES" | grep -Eq '^[0-9]+$'; then
            echo "::error::expected_public_files must be numeric"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_MAX_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::expected_max_date must be YYYY-MM-DD"
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_LIVE_SNAPSHOT_SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::expected_live_snapshot_sha256 must be a 64-hex SHA256"
            exit 1
          fi

      - name: Checkout BoopaDB repo (validator scripts + workflow pins)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable (trial-branch convention)
        with:
          persist-credentials: false

      - name: Set up Python (stdlib only, no pip installs)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, immutable
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node (exact reviewed runtime for the Gate A suite)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false

      - name: Verify QA review run identity via the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # actions/checkout cleans the workspace, wiping the promote-work
          # directory the first step created; recreate it before writing.
          mkdir -p promote-work
          # The QA review run lives in THIS repo, so its identity,
          # conclusion and executed workflow blob are all verifiable
          # here (v7 discipline): workflow path, dispatch event,
          # completed+success, and the qa-review workflow file's git
          # blob SHA at the run's head commit must equal the trusted
          # version pinned in generator/workflow_pins.json.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QA_RUN_ID}" > promote-work/qa-run.json
          QA_HEAD="$(python3 -c "import json; print(json.load(open('promote-work/qa-run.json'))['head_sha'])")"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/boopadb-qa-review.yml?ref=${QA_HEAD}" > promote-work/qa-file.json
          python3 - <<'PY'
          import json, sys
          from pathlib import Path

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          qa = json.loads(Path("promote-work/qa-run.json").read_text())
          if not str(qa.get("path", "")).endswith("boopadb-qa-review.yml"):
              fail(f"QA run is not the QA review workflow: path={qa.get('path')!r}")
          if qa.get("event") != "workflow_dispatch":
              fail("QA review run event is not workflow_dispatch")
          if qa.get("status") != "completed" or qa.get("conclusion") != "success":
              fail(f"QA review run not successfully completed: "
                   f"{qa.get('status')}/{qa.get('conclusion')}")
          pins = json.loads(Path("generator/workflow_pins.json").read_text())
          qa_blob = json.loads(
              Path("promote-work/qa-file.json").read_text()).get("sha")
          if qa_blob != pins["workflows"]["boopadb-qa-review.yml"]:
              fail(f"QA run's qa-review workflow blob {qa_blob} != "
                   f"pinned trusted version "
                   f"{pins['workflows']['boopadb-qa-review.yml']}")
          Path("promote-work/qa-workflow-blob.txt").write_text(qa_blob)
          print(f"QA review run verified: head={qa.get('head_sha')} "
                f"actor={qa.get('actor', {}).get('login')}; "
                f"qa-review workflow blob matches workflow_pins.json")
          PY

      - name: Download the QA review record from the QA review run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, immutable
        with:
          name: ${{ env.QA_REVIEW_ARTIFACT_NAME_PREFIX }}${{ inputs.qa_run_id }}
          run-id: ${{ inputs.qa_run_id }}
          github-token: ${{ github.token }}
          path: review
        # Layout: review/qa-review-record.json

      - name: Download candidate transport (Drive carrier ZIP, digest-pinned)
        run: |
          set -euo pipefail
          # PRODUCTION TRANSPORT (T1): the candidate artifact lives
          # in the tracker repo, whose artifacts this repo's token
          # cannot download. The carrier is the bare candidate ZIP
          # on Drive (anyone-with-link), created only from bytes
          # whose digest was verified against the tracker artifact
          # in Gate C. The transport is NOT trusted: the downloaded
          # bytes' SHA256 is asserted immediately against the
          # expected_digest dispatch input. Any interstitial/HTML
          # response fails the digest check and stops the run
          # (fail closed). The byte size is not pinned; it is read
          # from the file and recorded for the promotion record.
          curl -fL --retry 2 \
            "https://drive.usercontent.google.com/download?id=${CANDIDATE_FILE_ID}&export=download&confirm=t" \
            -o promote-work/candidate.zip
          actual_bytes="$(stat -c%s promote-work/candidate.zip)"
          actual_sha="$(sha256sum promote-work/candidate.zip | awk '{print $1}')"
          if [ "$actual_sha" != "$EXPECTED_DIGEST" ]; then
            echo "::error::candidate ZIP SHA256 mismatch: got $actual_sha, expected $EXPECTED_DIGEST"
            exit 1
          fi
          echo "CANDIDATE_ZIP_BYTES=$actual_bytes" >> "$GITHUB_ENV"
          echo "candidate transport OK: $actual_bytes bytes, sha256 $actual_sha"

      - name: Extract candidate ZIP + authenticate it
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, sys, zipfile
          from pathlib import Path

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def safe_extract(zf, dest):
              dest = Path(dest)
              seen = set()
              for info in zf.infolist():
                  name = info.filename
                  if name in seen:
                      fail(f"duplicate zip entry: {name}")
                  seen.add(name)
                  p = Path(name)
                  if p.is_absolute() or ".." in p.parts:
                      fail(f"unsafe zip entry: {name}")
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      fail(f"symlink zip entry refused: {name}")
                  target = dest / name
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(name))
              return seen

          # Candidate ZIP (the T1 carrier bytes themselves): the
          # digest was asserted against the expected_digest input in
          # the download step; re-assert it here on the exact bytes
          # being opened, then CRC, confined extraction, and a name
          # inventory kept for the EXPORT set-equality check in the
          # next step.
          blob = Path("promote-work/candidate.zip").read_bytes()
          if sha256(blob) != os.environ["EXPECTED_DIGEST"]:
              fail("candidate ZIP SHA256 != expected_digest")
          czf = zipfile.ZipFile("promote-work/candidate.zip")
          if czf.testzip() is not None:
              fail("candidate ZIP CRC check failed")
          names = safe_extract(czf, "cand")
          Path("promote-work/inner-names.json").write_text(
              json.dumps(sorted(names)))
          print(f"candidate ZIP authenticated: {len(blob)} bytes, "
                f"sha256 {sha256(blob)[:16]}…, {len(names)} entries")
          PY
          # Site tree = the candidate/ subtree of the artifact.
          # COPY, not move: the contract step below reads the EXPORT
          # inventory from cand/ AND the manifest chain from site/, so
          # both trees must exist at that point.
          cp -r cand/candidate site

      - name: Verify candidate contract (EXPORT inventory + verification + manifest chain)
        run: |
          set -euo pipefail
          # Plan decision 4: the promote gate binds to (a) the
          # artifact digest (previous step), (b) the EXPORT.json
          # byte inventory, (c) the snapshot-manifest hash chain.
          # It does NOT require receipt files — the artifact binds
          # receipts by hash only and carries no receipt documents.
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          expected_visible = int(os.environ["EXPECTED_VISIBLE"])

          # (b) EXPORT.json: full byte inventory of the artifact.
          exp = json.loads(Path("cand/EXPORT.json").read_text())
          if exp.get("schema") != "boopa-retained-candidate-inventory-r1":
              fail(f"EXPORT schema mismatch: {exp.get('schema')!r}")
          if exp.get("publication_performed") is not False:
              fail("EXPORT claims publication was performed — refused")
          if exp.get("public_files") != int(os.environ["EXPECTED_PUBLIC_FILES"]):
              fail(f"EXPORT public_files != {os.environ['EXPECTED_PUBLIC_FILES']}")
          # Production carries no compiled snapshot pin: the
          # snapshot identity is established by three-way consistency
          # — EXPORT declares it, verification.json must agree, and
          # the hash computed below from the extracted manifest bytes
          # must equal it. The computed value (CANDIDATE_SNAPSHOT_
          # ACTUAL) is what Gate A and the QA record bind to.
          declared_snapshot = exp.get("candidate_snapshot_sha256")
          if not declared_snapshot:
              fail("EXPORT declares no candidate_snapshot_sha256")
          names = set(json.loads(
              Path("promote-work/inner-names.json").read_text()))
          files = exp.get("files", {})
          # EXPORT.json is the inventory itself and is not its own
          # entry: its dict covers every other ZIP entry exactly
          # (verified against the real artifact: 725 entries =
          # 726 ZIP files - EXPORT.json).
          if set(files) != names - {"EXPORT.json"}:
              fail("EXPORT file set != candidate ZIP entry set "
                   "(excluding EXPORT.json itself)")
          for rel, meta in files.items():
              target = Path("cand") / rel
              if not target.is_file():
                  fail(f"EXPORT entry missing on disk: {rel}")
              data = target.read_bytes()
              if len(data) != meta.get("bytes"):
                  fail(f"EXPORT size mismatch: {rel}")
              if sha256(data) != meta.get("sha256"):
                  fail(f"EXPORT sha256 mismatch: {rel}")

          # verification.json: the generator-side validation record.
          # Its acceptance booleans are false BY DESIGN (it attests
          # only that the existing validator returned for these
          # bytes); a candidate claiming prior publication is refused.
          ver = json.loads(Path("cand/verification.json").read_text())
          if ver.get("schema") != "boopa-retained-candidate-verification-r1":
              fail(f"verification schema mismatch: {ver.get('schema')!r}")
          if ver.get("status") != "existing-publisher-validation-returned":
              fail(f"verification status mismatch: {ver.get('status')!r}")
          if ver.get("candidate_snapshot_sha256") != declared_snapshot:
              fail("verification candidate_snapshot_sha256 != "
                   "EXPORT candidate_snapshot_sha256")
          if ver.get("price_source_commit") != os.environ["TRACKER_COMMIT"]:
              fail("verification price_source_commit != tracker_commit input")
          if ver.get("publication_performed") is not False:
              fail("verification claims publication was performed — refused")
          if ver.get("publication_accepted") is not False:
              fail("verification claims publication was accepted — refused")

          # (c) snapshot-manifest hash chain + counts, on the exact
          # bytes that would be deployed.
          raw = Path("site/snapshot-manifest.json").read_bytes()
          actual_snapshot = sha256(raw)
          if actual_snapshot != declared_snapshot:
              fail(f"snapshot-manifest SHA256 {actual_snapshot} != "
                   f"the snapshot declared in EXPORT/verification "
                   f"{declared_snapshot}")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write(f"CANDIDATE_SNAPSHOT_ACTUAL={actual_snapshot}\n")
          man = json.loads(raw)
          if man.get("status") != "validated-candidate":
              fail(f"manifest status mismatch: {man.get('status')!r}")
          if man.get("deployed") is not False:
              fail("manifest claims the candidate is already deployed")
          val = man.get("validation", {})
          if val.get("ok") is not True or val.get("errors") != []:
              fail("manifest validation block is not ok/[]")
          if val.get("rows") != expected_visible or \
                  val.get("unique_ids") != expected_visible:
              fail(f"manifest rows/unique_ids != {expected_visible}")
          if val.get("max_date") != os.environ["EXPECTED_MAX_DATE"]:
              fail(f"manifest max_date != {os.environ['EXPECTED_MAX_DATE']}")
          if man.get("catalog_core", {}).get("rows") != expected_visible:
              fail("manifest catalog_core.rows != expected visible")
          # The manifest's own per-file ledger must match the tree.
          for rel, want in man.get("files", {}).items():
              target = Path("site") / rel
              if not target.is_file():
                  fail(f"manifest ledger entry missing on disk: {rel}")
              if sha256(target.read_bytes()) != want:
                  fail(f"manifest ledger sha256 mismatch: {rel}")

          # Visibility spot checks (Gate C values for this candidate):
          # the two must-hide items are in hidden_ids; the three
          # items whose 404s were superseded by refreshed metadata
          # are NOT hidden in this candidate.
          lists = json.loads(Path("site/lists_full.json").read_text())
          hidden = {str(x) for x in
                    lists.get("visibility", {}).get("hidden_ids", [])}
          for item in ("1000657", "7924941"):
              if item not in hidden:
                  fail(f"must-hide item {item} is not in hidden_ids")
          for item in ("8661298", "8720590", "8939746"):
              if item in hidden:
                  fail(f"item {item} is hidden but this candidate's "
                       "ledger treats it as visible")
          print(f"candidate contract OK: EXPORT {len(files)} entries "
                f"verified, snapshot {actual_snapshot[:16]}…, "
                f"visible={expected_visible}, hidden spot checks pass")
          PY

      - name: Lineage / freshness gate — the live site must be the expected parent
        run: |
          set -euo pipefail
          # Production lineage gate (pre-flight report §2 delta 6),
          # the production form of PLACEMENT §5.5 buildable on this
          # candidate contract: the live site's snapshot-manifest
          # must hash to the expected_live_snapshot_sha256 dispatch
          # input (deploy #1: the baseline pin; deploy #N+1: the
          # previous promotion record's deployed snapshot digest),
          # the candidate must not be older than the live site, must
          # differ from it, and its visible count must sit within
          # ±10% of the live rows. The live-before values are
          # recorded for the promotion record. Fail closed.
          curl -fsL "https://mametarogg.github.io/boopadb/snapshot-manifest.json" \
            -o promote-work/live-snapshot-manifest.json
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          raw = Path("promote-work/live-snapshot-manifest.json").read_bytes()
          live_digest = sha256(raw)
          expected_live = os.environ["EXPECTED_LIVE_SNAPSHOT_SHA256"]
          if live_digest != expected_live:
              fail(f"live snapshot-manifest SHA256 {live_digest} != "
                   f"expected parent {expected_live} — the live site "
                   f"is not the expected parent; refusing to deploy")
          live = json.loads(raw)
          live_val = live.get("validation", {})
          live_rows = live_val.get("rows")
          live_max = live_val.get("max_date")
          if not isinstance(live_rows, int) or not live_max:
              fail("live manifest lacks validation.rows / max_date")

          cand = json.loads(
              Path("site/snapshot-manifest.json").read_text())
          cand_val = cand.get("validation", {})
          cand_rows = cand_val.get("rows")
          cand_max = cand_val.get("max_date")
          cand_snapshot = os.environ["CANDIDATE_SNAPSHOT_ACTUAL"]
          if cand_max < live_max:
              fail(f"candidate max_date {cand_max} < live max_date "
                   f"{live_max} — candidate is older than the live "
                   f"site; refusing to deploy")
          if cand_snapshot == live_digest:
              fail("candidate snapshot == live snapshot — nothing "
                   "new to deploy; refusing")
          if abs(cand_rows - live_rows) * 10 > live_rows:
              fail(f"candidate visible {cand_rows} is outside the "
                   f"±10% band of live rows {live_rows}; refusing "
                   f"to deploy")
          Path("promote-work/lineage.json").write_text(json.dumps({
              "live_snapshot_sha256": live_digest,
              "live_rows": live_rows,
              "live_max_date": live_max,
          }, indent=1, sort_keys=True))
          print(f"lineage OK: live {live_digest[:16]}… "
                f"rows={live_rows} max_date={live_max}; candidate "
                f"rows={cand_rows} max_date={cand_max} "
                f"(band ±10% satisfied)")
          PY

      - name: Checkout tracker repo at the pinned commit (Gate A suite + raw histories)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          repository: ${{ env.TRACKER_REPO }}
          ref: ${{ inputs.tracker_commit }}
          path: source
          persist-credentials: false

      - name: Verify Gate A suite identity against the pinned code inventory
        run: |
          set -euo pipefail
          inv="source/.github/boopa/DEPLOYMENT-CODE-INVENTORY.json"
          suite="source/.github/boopa/auto-update-connection-20261108/pipeline-r4/verify_runtime_final_r2.cjs"
          inv_sha="$(sha256sum "$inv" | awk '{print $1}')"
          if [ "$inv_sha" != "$CODE_INVENTORY_SHA256" ]; then
            echo "::error::DEPLOYMENT-CODE-INVENTORY.json sha256 $inv_sha != pinned $CODE_INVENTORY_SHA256"
            exit 1
          fi
          suite_sha="$(sha256sum "$suite" | awk '{print $1}')"
          if [ "$suite_sha" != "$SUITE_SHA256" ]; then
            echo "::error::verify_runtime_final_r2.cjs sha256 $suite_sha != pinned $SUITE_SHA256"
            exit 1
          fi
          cp "$suite" promote-work/verify_runtime_final_r2.cjs
          echo "Gate A suite identity OK (inventory + suite hash pins match)"

      - name: Gate A — re-run the 76-check runtime suite on the candidate bytes
        run: |
          set -euo pipefail
          node promote-work/verify_runtime_final_r2.cjs \
            site "$CANDIDATE_SNAPSHOT_ACTUAL" promote-work/runtime-result.json
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          res = json.loads(Path("promote-work/runtime-result.json").read_text())
          # The release gate condition (publisher-r4/release_entry.py):
          # status PASS, check_count == len(checks), check_count >= 76.
          if res.get("status") != "PASS":
              fail(f"runtime suite status is not PASS: {res.get('status')!r}")
          checks = res.get("checks", [])
          if res.get("check_count") != len(checks):
              fail("runtime suite check_count != len(checks)")
          if res.get("check_count", 0) < 76:
              fail(f"runtime suite check_count {res.get('check_count')} < 76")
          if res.get("candidate_snapshot_sha256") != \
                  os.environ["CANDIDATE_SNAPSHOT_ACTUAL"]:
              fail("runtime suite snapshot != the snapshot computed "
                   "from the verified bytes")
          if res.get("test_script_sha256") != os.environ["SUITE_SHA256"]:
              fail("runtime suite test_script_sha256 != pinned suite")
          # Scope honesty: the suite itself declares it is not a
          # publication approval; record it, do not override it.
          if res.get("publication_eligible") is not False:
              fail("runtime suite unexpectedly claims publication_eligible")
          print(f"Gate A OK: PASS, {res['check_count']} checks")
          PY

      - name: Gate projection — re-verify the current-price projection contract
        run: |
          set -euo pipefail
          # v7 invocation carried over: the evaluation time is THIS
          # run's current UTC — evidence valid at build time but
          # expired by promotion time would fail here. For THIS
          # candidate the gate takes its verified not-applied path:
          # the full site inventory is scanned for a payload file or
          # bootstrap/usage markers on every route before any
          # "no projection" conclusion. If a future candidate DID
          # apply a projection, this step would require the v7
          # staging files (projection declaration/package/evidence),
          # which the tracker pipeline does not currently emit —
          # the gate then fails closed (see PLACEMENT.md).
          mkdir -p promote-work/proj
          EVALUATION_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "projection gate evaluation time (promotion run, UTC): $EVALUATION_TIME"
          python3 generator/scripts/check_projection.py --gate \
            --work-dir promote-work/proj --site-dir site \
            --raw-dir source/data \
            --evaluation-time "$EVALUATION_TIME"

      - name: Assert the QA review record bindings (approval resolved, not referenced)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          rec = json.loads(Path("review/qa-review-record.json").read_text())
          if rec.get("schema") != 1:
              fail(f"review record schema mismatch: {rec.get('schema')!r}")
          if rec.get("source_run_id") != os.environ["CANDIDATE_RUN_ID"]:
              fail("review record source_run_id != candidate_run_id input")
          if rec.get("source_repo") != os.environ["TRACKER_REPO"]:
              fail("review record source_repo mismatch")
          if rec.get("candidate_artifact_id") != \
                  os.environ["CANDIDATE_ARTIFACT_ID"]:
              fail("review record candidate_artifact_id != input")
          if rec.get("artifact_digest") != os.environ["EXPECTED_DIGEST"]:
              fail("review record artifact_digest != expected_digest "
                   "(the record's digest is recomputed by the QA review "
                   "workflow from the artifact bytes, never typed in)")
          if rec.get("candidate_snapshot_sha256") != \
                  os.environ["CANDIDATE_SNAPSHOT_ACTUAL"]:
              fail("review record candidate_snapshot_sha256 != the "
                   "snapshot hash computed from the verified bytes")
          if rec.get("price_source_commit") != os.environ["TRACKER_COMMIT"]:
              fail("review record price_source_commit != tracker_commit")
          if rec.get("verdict") != "pass":
              fail(f"QA review verdict is not 'pass': {rec.get('verdict')!r}")
          if rec.get("qa_run_id") != os.environ["QA_RUN_ID"]:
              fail("review record qa_run_id != qa_run_id input")
          if rec.get("environment") != "qa-approval":
              fail(f"review record environment is not 'qa-approval': "
                   f"{rec.get('environment')!r}")
          blob = Path("promote-work/qa-workflow-blob.txt").read_text().strip()
          if rec.get("qa_workflow_blob") != blob:
              fail("review record qa_workflow_blob != the qa-review "
                   "blob the QA run executed (verified via the API)")
          print("QA review record bindings OK (run, digest, snapshot, "
                "verdict, environment, workflow blob)")
          PY

      - name: Upload verified site tree (the bytes about to be deployed)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: boopadb-site-${{ github.run_id }}
          path: site
          retention-days: 7
          include-hidden-files: true
          overwrite: false
        # The exact bytes verified above (including .nojekyll),
        # kept 7 days for post-deploy diffing against the live site.

      # ------------------------------------------------------------------
      # DEPLOY — LIVE (production). Every gate above has passed on
      # these exact bytes; the two steps below publish them.
      # ------------------------------------------------------------------
      - name: Upload Pages artifact (the verified extracted bytes)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write promotion record + step summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          rec = json.loads(Path("review/qa-review-record.json").read_text())
          runtime = json.loads(
              Path("promote-work/runtime-result.json").read_text())
          lineage = json.loads(
              Path("promote-work/lineage.json").read_text())
          record = {
              "schema": 1,
              "promoted_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "promotion_run_id": os.environ["GITHUB_RUN_ID"],
              "candidate_run_id": os.environ["CANDIDATE_RUN_ID"],
              "candidate_artifact_id": os.environ["CANDIDATE_ARTIFACT_ID"],
              "candidate_zip_sha256": os.environ["EXPECTED_DIGEST"],
              "candidate_zip_bytes":
                  int(os.environ["CANDIDATE_ZIP_BYTES"]),
              "candidate_snapshot_sha256":
                  os.environ["CANDIDATE_SNAPSHOT_ACTUAL"],
              "deployed_snapshot_sha256":
                  os.environ["CANDIDATE_SNAPSHOT_ACTUAL"],
              "page_url": os.environ["PAGE_URL"],
              "live_before": lineage,
              "tracker_commit": os.environ["TRACKER_COMMIT"],
              "visible_items": int(os.environ["EXPECTED_VISIBLE"]),
              "gate_a": {
                  "status": runtime["status"],
                  "check_count": runtime["check_count"],
                  "test_script_sha256": runtime["test_script_sha256"],
              },
              "projection_gate": "passed (see step log)",
              "qa_run_id": os.environ["QA_RUN_ID"],
              "qa_report_ref": rec["qa_report_ref"],
              "qa_reviewer": rec["reviewer"],
              "qa_reviewed_at": rec["reviewed_at"],
          }
          Path("promote-work/promotion-record.json").write_text(
              json.dumps(record, indent=1, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## BoopaDB promotion\n\n")
              for k, v in record.items():
                  fh.write(f"- {k}: {v}\n")
          print(record)
          PY

      - name: Upload promotion record artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: boopadb-promotion-${{ github.run_id }}
          path: promote-work/promotion-record.json
          retention-days: 7
          overwrite: false

      - name: Stage failure evidence — promote (stage, run ID, diagnostics)
        if: failure()
        run: |
          set -euo pipefail
          rm -rf failure-evidence
          mkdir -p failure-evidence
          cp -r promote-work/. failure-evidence/ 2>/dev/null || true
      - name: Upload failure evidence — promote
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, immutable
        with:
          name: boopadb-failure-promote-${{ github.run_id }}
          path: failure-evidence
          retention-days: 7
          if-no-files-found: warn
          overwrite: false
