name: Boopa bounded read access probe
'on':
  push:
    branches: [chore/auto-update-trial-20261101]
    paths: [.github/workflows/boopadb-read-access-probe.yml]
permissions: {}
jobs:
  read-access:
    if: github.repository == 'MametaroGG/boopadb' && github.ref == 'refs/heads/chore/auto-update-trial-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Read fixed repository metadata and bounded artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -I - <<'PYTHON'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          
          REPOS = ('MametaroGG/booth-vrc-price-tracker', 'MametaroGG/boopadb')
          MAX_JSON = 262144
          MAX_ARTIFACT = 100 * 1024 * 1024
          RANGE_BYTES = 64
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          # No cookies, no ambient proxies, no automatic redirects, no credential helpers.
          OPENER = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          
          def valid_id(value):
              return type(value) is int and 0 < value < 2**63
          
          def allowed_download(url):
              try:
                  if not isinstance(url, str) or any(ord(c) <= 32 or ord(c) == 127 for c in url) or '\\' in url:
                      return False
                  p = urllib.parse.urlsplit(url)
                  host = p.hostname or ''
                  path = urllib.parse.unquote(p.path)
                  parts = path.split('/')
                  # Known artifact storage transport only. Unknown GitHub transports are
                  # intentionally unverified, not followed to arbitrary repo/API paths.
                  return (p.scheme == 'https' and not p.username and not p.password
                          and p.port in (None, 443) and not p.fragment
                          and host.endswith('.blob.core.windows.net')
                          and bool(host.removesuffix('.blob.core.windows.net'))
                          and len(parts) >= 3 and parts[0] == ''
                          and all(part and part not in ('.', '..') for part in parts[1:])
                          and '\\' not in path
                          and not any(ord(c) < 32 or ord(c) == 127 for c in path))
              except (ValueError, TypeError):
                  return False
          
          def request(url, token=None, download=False, redirect_only=False):
              # Authenticated URLs can only be constructed by api() from fixed repos.
              p = urllib.parse.urlsplit(url)
              if token is not None and (p.scheme != 'https' or p.netloc != 'api.github.com'):
                  return 0, None, None, 'blocked_auth_host'
              if download and not allowed_download(url):
                  return 0, None, None, 'blocked_redirect_host'
              headers = {'User-Agent': 'boopadb-read-access-probe'}
              if token is not None:
                  headers.update({'Authorization': 'Bearer ' + token,
                                  'Accept': 'application/vnd.github+json',
                                  'X-GitHub-Api-Version': '2022-11-28'})
              if download:
                  headers['Range'] = 'bytes=0-63'
              req = urllib.request.Request(url, headers=headers, method='GET')
              try:
                  try:
                      response = OPENER.open(req, timeout=15)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      status = response.code
                      if status in (301, 302, 303, 307, 308):
                          return status, None, response.headers.get('Location'), 'redirect'
                      if redirect_only:
                          return status, None, None, 'archive_redirect_required'
                      if status != 200 and not (download and status == 206):
                          return status, None, None, 'http_error'
                      if download:
                          data = response.read(RANGE_BYTES)
                          return status, None, None, 'bounded_access' if data else 'empty_response'
                      data = response.read(MAX_JSON + 1)
                      if len(data) > MAX_JSON:
                          return status, None, None, 'metadata_too_large'
                      parsed = json.loads(data)
                      if not isinstance(parsed, dict):
                          return status, None, None, 'invalid_metadata'
                      return status, parsed, None, 'metadata_access'
              except Exception:
                  # Never render exception text: it can include signed URLs or headers.
                  return 0, None, None, 'request_failed'
          
          def api(repo, path, token):
              if repo not in REPOS:
                  return 0, None, None, 'blocked_repo'
              # Do not accept metadata-provided URLs or arbitrary endpoint paths.
              import re
              if not re.fullmatch(r'(?:actions/runs\?status=completed&per_page=1|actions/runs/[1-9][0-9]*/jobs\?per_page=10|actions/artifacts\?per_page=10|actions/artifacts/[1-9][0-9]*/zip)', path):
                  return 0, None, None, 'blocked_path'
              return request('https://api.github.com/repos/' + repo + '/' + path, token, redirect_only=path.endswith('/zip'))
          
          def probe(token):
              records = []
              selected = None
              for repo in REPOS:
                  status, data, _, result = api(repo, 'actions/runs?status=completed&per_page=1', token)
                  row = {'repository': repo, 'operation': 'runs', 'http_status': status, 'result': result}
                  runs = data.get('workflow_runs', []) if data else []
                  run = runs[0] if isinstance(runs, list) and runs and isinstance(runs[0], dict) else {}
                  rid = run.get('id')
                  if valid_id(rid) and isinstance(run.get('repository'), dict) and run['repository'].get('full_name') == repo and run.get('status') == 'completed':
                      row['run_id'] = rid
                      records.append(row)
                      js, jd, _, jr = api(repo, f'actions/runs/{rid}/jobs?per_page=10', token)
                      jobs = jd.get('jobs', []) if jd else []
                      ids = [j['id'] for j in jobs[:10] if isinstance(j, dict) and valid_id(j.get('id')) and j.get('run_id') == rid] if isinstance(jobs, list) else []
                      records.append({'repository': repo, 'operation': 'jobs', 'run_id': rid, 'job_ids': ids, 'http_status': js, 'result': jr})
                  else:
                      if result == 'metadata_access':
                          row['result'] = 'no_completed_run' if not runs else 'invalid_run_metadata'
                      records.append(row)
                  status, data, _, result = api(repo, 'actions/artifacts?per_page=10', token)
                  artifacts = data.get('artifacts', []) if data else []
                  eligible = [a for a in artifacts[:10] if isinstance(a, dict) and valid_id(a.get('id')) and a.get('expired') is False and type(a.get('size_in_bytes')) is int and 0 < a['size_in_bytes'] <= MAX_ARTIFACT and isinstance(a.get('workflow_run'), dict) and valid_id(a['workflow_run'].get('id'))] if isinstance(artifacts, list) else []
                  records.append({'repository': repo, 'operation': 'artifacts', 'http_status': status, 'result': ('eligible_artifact' if eligible else 'no_eligible_artifact_in_bounded_listing') if result == 'metadata_access' else result})
                  if selected is None and eligible:
                      selected = (repo, eligible[0])
              if selected is None:
                  records.append({'operation': 'archive', 'result': 'not_attempted_no_eligible_artifact'})
                  return records
              repo, artifact = selected
              row = {'repository': repo, 'operation': 'archive', 'artifact_id': artifact['id'], 'run_id': artifact['workflow_run']['id']}
              status, _, location, result = api(repo, f"actions/artifacts/{artifact['id']}/zip", token)
              row['http_statuses'] = [status]
              if result == 'redirect':
                  for _ in range(3):
                      if not allowed_download(location):
                          result = 'blocked_redirect_host'
                          break
                      status, _, location, result = request(location, download=True)
                      row['http_statuses'].append(status)
                      if result != 'redirect':
                          break
                  else:
                      result = 'redirect_limit'
              row['result'] = result
              records.append(row)
              return records
          
          def main():
              token = os.environ.get('GH_TOKEN')
              try:
                  records = probe(token) if token else [{'result': 'missing_token'}]
              except Exception:
                  records = [{'result': 'invalid_metadata_or_internal_error'}]
              rendered = json.dumps(records, indent=2)
              print(rendered)
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as handle:
                      handle.write('## Read-only access probe\n\nArchive success means at most 64 bytes read, not full ZIP verification.\n\n```json\n' + rendered + '\n```\n')
          
          if __name__ == '__main__':
              main()
          PYTHON
