      - name: Upload exactly one synthetic artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: boopa-transport-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage9-artifact-roundtrip/transport-smoke.json
          retention-days: 7
          overwrite: false
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
      - name: Verify the exact uploaded ID and ZIP before handoff
