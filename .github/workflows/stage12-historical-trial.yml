# Authorized one-time historical non-serving trial. Install only with its exact
# reviewed export and adapter; first-run and first-attempt guards remain enforced.
# This can never establish current-source eligibility or publication authority.
name: Stage12 historical non-serving replay
on:
  push:
    branches: [chore/auto-update-trial-20261101]
    paths: [.github/workflows/stage12-historical-trial.yml]
permissions: {}
concurrency:
  group: boopadb-stage12-historical-trial
  cancel-in-progress: false
jobs:
  trial:
    if: ${{ github.repository == 'MametaroGG/boopadb' && github.workflow_ref == 'MametaroGG/boopadb/.github/workflows/stage12-historical-trial.yml@refs/heads/chore/auto-update-trial-20261101' && github.event_name == 'push' && github.ref == 'refs/heads/chore/auto-update-trial-20261101' && github.run_number == 1 && github.run_attempt == 1 }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: stage12-historical-trial
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install existing pinned requirement
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r stage12-historical-trial/export/qa-contract/requirements.txt
      - name: Replay pinned historical source and independently validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADAPTER_SHA256: 19dc60f5d92faf88ded7fb0774d1a2cb1164c957075321a169a55d8f8fb08fbe
        run: |
          set -euo pipefail
          umask 077
          python -B stage12-historical-trial/adapter/trial_adapter.py run \
            --export stage12-historical-trial/export \
            --adapter-sha256 "$ADAPTER_SHA256" \
            --output "$RUNNER_TEMP/stage12-historical-result" > /dev/null
      - name: Retain only the successful aggregate result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stage12-historical-result-${{ github.run_id }}-1
          path: ${{ runner.temp }}/stage12-historical-result/trial-result.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false
# No scheduled trigger, Pages, write token, publisher, source/proof artifact,
# private log upload, or candidate upload. Historical result is never publishable.
