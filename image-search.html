<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>画像検索 | BoopaDB</title><link rel="stylesheet" href="image-search.css"><link rel="stylesheet" href="image-search-page.css"></head>
<body>
<section id="imageSearchPage" aria-labelledby="imageSearchTitle">
  <div class="image-search-shell">
    <div class="image-search-head"><span class="image-search-brand">BoopaDB <span data-i="img_search">画像検索</span></span><div class="image-search-controls"><select id="imageLang" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option></select><button id="imageTheme" type="button" data-i-al="th_toggle">◐</button><button id="imageSearchClose" type="button" data-i="img_page_back">戻る</button></div></div>
    <div class="image-search-intro"><h1 id="imageSearchTitle" tabindex="-1" data-i="img_page_title">画像から、気になる商品を。</h1><p data-i="img_page_intro">画像を選んで、似ているBOOTH商品を探しましょう。画像全体でも、気になる部分を囲んでも検索できます。</p></div>
    <div class="image-upload-card">
      <button type="button" class="image-drop" id="spImgDrop" aria-describedby="imageUploadFormats spImgDropErrorText">
        <span class="image-upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg></span>
        <span class="image-upload-title" data-i="img_page_upload">画像をアップロード</span>
        <span class="image-upload-hint" data-i="img_page_hint">ここにドラッグ＆ドロップ、またはクリックして選択</span>
        <span class="image-upload-formats" id="imageUploadFormats" data-i="img_page_formats">PNG・JPEG・WebPなどの画像 ／ 1枚・20MBまで</span>
      </button>
      <p class="image-search-legal"><a href="terms.html" data-i="ft_terms">利用規約</a> · <a href="privacy.html" data-i="ft_priv">プライバシー</a></p>
    </div>
    <section class="image-explain" id="imageExplain" aria-label="画像検索について"></section>
    <section class="image-faq" id="imageFaq" aria-labelledby="imageFaqTitle"></section>
    <nav class="image-help-links"><a href="terms.html" data-i="ft_terms">利用規約</a><a href="privacy.html" data-i="ft_priv">プライバシー</a><a href="https://github.com/MametaroGG/boopadb/issues" target="_blank" rel="noopener">GitHub Issues</a></nav>
  </div>
</section>
<div id="spImgDropError" class="image-drop-error" hidden><span id="spImgDropErrorText" role="status" aria-live="polite"></span><button id="spImgDropErrorClose" type="button" data-i-al="al_close" aria-label="閉じる">×</button></div><div id="lensView" hidden role="dialog" aria-modal="true" aria-label="画像検索" data-i-al="img_search">
  <div class="lv-head"><button id="lvBack" class="igs-x" type="button" data-i-al="al_back" aria-label="戻る"><svg viewBox="0 0 24 24"><path d="M19 12H5m6 7-7-7 7-7"/></svg></button><img id="lvThumb" alt=""><div class="lv-title" data-i="img_search">画像検索</div><div class="lv-count" id="lvCount"></div></div>
  <div class="lv-stage" id="lvStage"><div class="lv-wrap" id="lvWrap"><img id="lvImg" alt=""><svg id="lvSvg"></svg><canvas id="lvDraw"></canvas></div><button id="lvFitBtn" class="igs-btn lv-fitbtn" type="button" hidden data-i="lv_fit">全体を表示</button><span class="lv-hint" id="lvHint" data-i="img_trace_hint">探したいものを指やマウスでなぞって囲んでください</span></div>
  <div class="lv-tools" id="lvTools"><span class="lv-tbtns"><button id="lvWhole" class="igs-btn" type="button" data-i="img_use_whole">画像全体で検索</button><button id="lvRetake" class="igs-btn" type="button" data-i="img_retake">選び直す</button></span></div>
  <div class="lv-sheet" id="lvSheet"><div class="lv-grab" id="lvGrab"><span class="lv-grabbar"></span></div><div class="lv-sheetbody" id="lvSheetBody"><div class="lv-note" id="lvNote" hidden></div><div class="image-result-grid lv-results" id="lvResults"></div></div></div>
</div>
<p id="imageLoadError" class="image-page-error" role="alert" hidden>画像検索を読み込めませんでした。ページを再読み込みしてください。 / Image search could not load. Please reload.</p>
<input id="spImgFile" type="file" accept="image/*" hidden>
<noscript>画像検索にはJavaScriptが必要です。 <a href="index.html">BoopaDBへ戻る</a></noscript>
<script src="image-search-i18n.js"></script>
<script src="image-search-faq.js"></script>
<script src="image-drop.js"></script>
<script src="image-search-page.js" onerror="document.getElementById('imageLoadError').hidden=false"></script>
<script src="image-search-engine.js" onerror="document.getElementById('imageLoadError').hidden=false"></script>
<script>if (typeof initImageLens === "function") initImageLens();</script>
<script src="site-update.js" defer></script>
</body></html>
